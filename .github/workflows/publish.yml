# 태그를 올리면 npm 에 배포한다. 토큰을 어디에도 두지 않는다 — npm 의 trusted publishing 이
# GitHub 가 발급한 OIDC 토큰으로 이 저장소·이 워크플로를 확인한다. 토큰으로 2FA 를 우회하는
# 방식은 2027-01 에 없어지므로 그 전에 여기로 옮겨 둔다.
#
# npmjs.com 의 패키지 설정에서 trusted publisher 를 한 번 연결해야 한다. 거기 적는
# 워크플로 파일명이 이 파일 이름과 **글자까지 같아야** 한다: publish.yml
name: publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  # OIDC 토큰 발급. 이것이 없으면 npm 이 누가 올리는지 확인할 수 없다.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # 테스트는 bun 으로 돈다. 배포만 npm CLI 가 한다 — trusted publishing 은 npm 11.5.1 이상.
      - run: bun test

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - run: npm install -g npm@latest

      - name: 태그와 package.json 버전이 같은지 본다
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $tag != package.json $pkg"
            exit 1
          fi

      - run: npm publish
